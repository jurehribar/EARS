        jvmTarget = "17"
    }
}
compileTestKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}

// ── Attraction Basin Pipeline ─────────────────────────────────────────────────
// Each problem from config.properties gets its own set of 3 JavaExec tasks,
// each running in a separate JVM with full heap/stack memory.
// Usage:
//   gradlew runAllAttractionBasins          – run all problems end-to-end
//   gradlew runHeatMap_Easom                – single stage, single problem
//   gradlew runHeatMap_Easom runFill_Easom runMeasure_Easom
// Edit config.properties to change problems/resolution/dirs — no recompile needed.

def attractionJvmArgs = ['-Xmx16g', '-Xms4g']

if (file('config.properties').exists()) {
    def pipelineProps = new Properties()
    file('config.properties').withInputStream { pipelineProps.load(it) }

    def problemEntries = pipelineProps.getProperty('problems', 'Easom').split(',')
    def prevMeasureTask = null   // actual task object reference for reliable ordering

    problemEntries.each { entry ->
        entry = entry.trim()
        if (entry.isEmpty()) return
        def parts       = entry.split(':')
        def problemName = parts[0].trim()
        def problemDims = parts.length > 1 ? parts[1].trim() : '2'
        def problemArgs = attractionJvmArgs + ["-DproblemName=${problemName}", "-DproblemDims=${problemDims}"]

        // Use task object references so mustRunAfter is resolved correctly
        def heatMapTask = task("runHeatMap_${problemName}", type: JavaExec) {
            group       = 'attraction basins'
            description = "Generate heatmap for ${problemName}"
            mainClass   = 'org.um.feri.analyse.attractionBasins.TestHeatMap2D'
            classpath   = sourceSets.main.runtimeClasspath
            jvmArgs     = problemArgs
            // Cross-problem: this problem's HeatMap must run AFTER the previous problem's Measure
            if (prevMeasureTask != null) mustRunAfter prevMeasureTask
        }

        def fillTask = task("runFill_${problemName}", type: JavaExec) {
            group       = 'attraction basins'
            description = "Run scanline fill for ${problemName}"
            mainClass   = 'org.um.feri.analyse.attractionBasins.TestFill2D'
            classpath   = sourceSets.main.runtimeClasspath
            jvmArgs     = problemArgs
            mustRunAfter heatMapTask   // within-problem: Fill after HeatMap
        }

        def measureTask = task("runMeasure_${problemName}", type: JavaExec) {
            group       = 'attraction basins'
            description = "Render images for ${problemName}"
            mainClass   = 'org.um.feri.analyse.attractionBasins.Measure'
            classpath   = sourceSets.main.runtimeClasspath
            jvmArgs     = problemArgs
            mustRunAfter fillTask      // within-problem: Measure after Fill
        }

        prevMeasureTask = measureTask
    }

    task runAllAttractionBasins {
        group       = 'attraction basins'
        description = 'Runs all 3 pipeline stages for every problem listed in config.properties.'
        problemEntries.each { entry ->
            def problemName = entry.trim().split(':')[0].trim()
            if (!problemName.isEmpty())
                // Depend on all three stages — mustRunAfter chain above enforces the order
                dependsOn "runHeatMap_${problemName}", "runFill_${problemName}", "runMeasure_${problemName}"
        }
    }

    // ── Combined (in-memory) tasks — no intermediate files written ────────────
    // Each problem gets a single-JVM task that runs HeatMap → Fill → Measure
    // entirely in memory. Only the two PNG images are written to disk.
    // Usage:
    //   gradlew runCombinedTest_Rastrigin
    //   gradlew runAllCombinedTests
    def prevCombinedTask = null

    problemEntries.each { entry ->
        entry = entry.trim()
        if (entry.isEmpty()) return
        def parts       = entry.split(':')
        def problemName = parts[0].trim()
        def problemDims = parts.length > 1 ? parts[1].trim() : '2'
        def problemArgs = attractionJvmArgs + ["-DproblemName=${problemName}", "-DproblemDims=${problemDims}"]

        def combinedTask = task("runCombinedTest_${problemName}", type: JavaExec) {
            group       = 'attraction basins'
            description = "Run full in-memory pipeline (HeatMap+Fill+Measure) for ${problemName} — produces only PNG images"
            mainClass   = 'org.um.feri.analyse.attractionBasins.CombinedTest'
            classpath   = sourceSets.main.runtimeClasspath
            jvmArgs     = problemArgs
            if (prevCombinedTask != null) mustRunAfter prevCombinedTask
        }
        prevCombinedTask = combinedTask
    }

    task runAllCombinedTests {
        group       = 'attraction basins'
        description = 'Runs the combined in-memory pipeline for every problem in config.properties.'
        problemEntries.each { entry ->
            def problemName = entry.trim().split(':')[0].trim()
            if (!problemName.isEmpty())
                dependsOn "runCombinedTest_${problemName}"
        }
    }

} else {
    logger.warn("WARNING: config.properties not found — attraction basin tasks not generated.")
}
