version = '1.0'

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Implementation-Title': 'EARS',
                   'Implementation-Version': '1.0',
                   'Main-Class': 'org.um.feri.ears.engine.ExecuteTournaments'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } //include all dependencies in jar
    }
    exclude {
    	
    }
}

sourceSets {
    main {
        java {
            srcDir 'src'
            exclude 'test/**'
        }
        resources {
            srcDirs 'Weight', 'test_data', 'src', 'res'
            exclude 'test/**'
        }
   }
    test {
        java {
            srcDir 'src/test/java'
        }
    }
}

def mdeExperimentPropertiesFile = file('config.properties')
if (!mdeExperimentPropertiesFile.exists()) {
    throw new GradleException('config.properties is required for MDE experiment tasks')
}
def mdeExperimentProps = new Properties()
mdeExperimentPropertiesFile.withInputStream { mdeExperimentProps.load(it) }

def mdeStrategyValue = mdeExperimentProps.getProperty('mde.strategy', 'rand').trim()
def mdeAlgorithm
def deAlgorithm
if (mdeStrategyValue.equalsIgnoreCase('best')
        || mdeStrategyValue.equalsIgnoreCase('MDE-best-1-bin')) {
    mdeAlgorithm = 'MDE-best-1-bin'
    deAlgorithm = 'DE-best-1-binOldNew'
} else if (mdeStrategyValue.equalsIgnoreCase('rand')
        || mdeStrategyValue.equalsIgnoreCase('MDE-rand-1-bin')) {
    mdeAlgorithm = 'MDE-rand-1-bin'
    deAlgorithm = 'DE-rand-1-binOldNew'
} else {
    throw new GradleException("Unsupported mde.strategy '${mdeStrategyValue}'. Use rand or best.")
}
def mdeHistoryDir = mdeExperimentProps.getProperty('mde.historyDir', 'History/MDE').trim()
def mdeAnalysisDir = mdeExperimentProps.getProperty('mde.analysisDir', 'EEAnalysis/MDE').trim()
def mdeProblem = mdeExperimentProps.getProperty('mde.problem', 'Rastrigin').trim()
def mdeDimension = mdeExperimentProps.getProperty('mde.dimension', '10').trim()
def mdePopulation = mdeExperimentProps.getProperty('mde.population', '30').trim()
def mdeEvaluations = mdeExperimentProps.getProperty('mde.evaluations', '20000').trim()
def mdeRun = mdeExperimentProps.getProperty('mde.run', 'all').trim()
def mdeEliteSize = mdeExperimentProps.getProperty('mde.eliteSize', '1').trim()
def mdeLocalSearchFrequency = mdeExperimentProps.getProperty('mde.localSearchFrequency', '1').trim()
def mdeLocalSearchStartFE = (findProperty('mdeLocalSearchStartFE')
        ?: mdeExperimentProps.getProperty('mde.localSearchStartFE', '0')).toString().trim()
def mdeF = mdeExperimentProps.getProperty('mde.F', '0.5').trim()
def mdeCR = mdeExperimentProps.getProperty('mde.CR', '0.9').trim()

def runMdeTask = tasks.register('runMdeEEExperiment', JavaExec) {
    group = 'MDE experiments'
    description = 'Run the logged MDE E/E experiment configured in config.properties.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.um.feri.ears.experiment.ee.EEExperimentRunner'
    args mdeAlgorithm, mdeHistoryDir, mdeProblem, mdeDimension, mdePopulation,
            mdeEvaluations, 'K', mdeRun, mdeEliteSize, mdeLocalSearchFrequency, mdeF, mdeCR,
            mdeLocalSearchStartFE
}

def analyzeMdeTask = tasks.register('analyzeMdeEEExperiment', JavaExec) {
    group = 'MDE experiments'
    description = 'Analyze the ten logged MDE runs configured in config.properties.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.um.feri.ears.experiment.ee.EEAnalysisRunner'
    args mdeAlgorithm, mdeHistoryDir, mdeAnalysisDir, mdeProblem, mdeDimension,
            mdePopulation, mdeEvaluations, 'K', mdeEliteSize, mdeLocalSearchFrequency, mdeF, mdeCR,
            mdeLocalSearchStartFE
    mustRunAfter runMdeTask
}

def runDeTask = tasks.register('runDeEEExperiment', JavaExec) {
    group = 'MDE experiments'
    description = 'Run the matching target-parent OldNew DE E/E experiment configured in config.properties.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.um.feri.ears.experiment.ee.EEExperimentRunner'
    args deAlgorithm, mdeHistoryDir, mdeProblem, mdeDimension, mdePopulation,
            mdeEvaluations, 'K', mdeRun, mdeEliteSize, mdeLocalSearchFrequency, mdeF, mdeCR
    mustRunAfter runMdeTask
}

def analyzeMdeVsDeTask = tasks.register('analyzeMdeVsDeExperiment', JavaExec) {
    group = 'MDE experiments'
    description = 'Analyze matching MDE and OldNew DE histories into the same aggregate outputs.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.um.feri.ears.experiment.ee.EEAnalysisRunner'
    args '--compare', mdeAlgorithm, deAlgorithm, mdeHistoryDir, mdeAnalysisDir,
            mdeProblem, mdeDimension, mdePopulation, mdeEvaluations, 'K',
            mdeEliteSize, mdeLocalSearchFrequency, mdeF, mdeCR, mdeLocalSearchStartFE
    mustRunAfter runMdeTask, runDeTask
}

tasks.register('runAndAnalyzeMdeEEExperiment') {
    group = 'MDE experiments'
    description = 'Run all ten configured MDE repetitions, then perform E/E analysis.'
    if (mdeRun.equalsIgnoreCase('all')) {
        dependsOn runMdeTask, analyzeMdeTask
    } else {
        doLast {
            throw new GradleException('runAndAnalyzeMdeEEExperiment requires mde.run=all')
        }
    }
}

tasks.register('runAndAnalyzeMdeVsDeExperiment') {
    group = 'MDE experiments'
    description = 'Run MDE, run matching OldNew DE, then analyze both sequentially.'
    if (mdeRun.equalsIgnoreCase('all')) {
        dependsOn runMdeTask, runDeTask, analyzeMdeVsDeTask
    } else {
        doLast {
            throw new GradleException('runAndAnalyzeMdeVsDeExperiment requires mde.run=all')
        }
    }
}

tasks.register('runSOBenchmarkJureH', JavaExec) {
    group = 'MDE experiments'
    description = 'Run JureHBenchmark using the configured MDE strategy and local-search schedule.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.um.feri.ears.examples.SOBenchmarkJureH'
    args mdeStrategyValue, mdeEliteSize, mdeLocalSearchFrequency, mdeLocalSearchStartFE
}

configurations {
    jar.archiveFileName = 'ears.jar'
}

