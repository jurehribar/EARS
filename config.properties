# ----------------------------------

# ── Attraction Basin Pipeline Configuration ───────────────────────────────────
# resolution: number of sample points per dimension
resolution=10000

# minPlateauSize: minimum fat-core size for a flat region to qualify as a plateau
# N=1 → any region with interior cell(s) qualifies (default)
# Higher N → only wider/larger flat areas qualify
minPlateauSize=5

# plateauEpsilon: tolerance used in makeBoundariesPlateau() when comparing f values.
# Two adjacent cells with |f_a - f_b| <= plateauEpsilon are treated as equally flat.
# 0.0  → exact equality only (original behaviour)
# 1e-6 → ignore floating-point noise
# Larger values → treat gentle slopes as flat plateaus
plateauEpsilon=0.0000001

# Folder paths (use forward slashes, even on Windows)
heatmapDir=/Users/jurehribar/Dev/TestEARS/HeatMaps
scanlineDir=/Users/jurehribar/Dev/TestEARS/ScanLine
picturesDir=/Users/jurehribar/Dev/TestEARS/Pictures
#heatmapDir=C:/Dev/TestEARS/HeatMaps
#scanlineDir=C:/Dev/TestEARS/ScanLine
#picturesDir=C:/Dev/TestEARS/Pictures


# Problems to run — one comma-separated list.
# Format: ClassName          (for fixed-2D problems)
#         ClassName:dims     (for problems that take a dimension argument)
# All problems are forced to 2D; :2 is the default if omitted.
#problems=Easom,Rastrigin:2,Sphere:2,ShiftedCoupledSineBowl:2,InvertedHemispheres,TanhRadialStep,SpherePlateau,RastriginPlateau,PiecewiseLinearPlateau,PiecewiseLinear1D_Y
#problems=Easom,Rastrigin:2,Sphere:2,InvertedHemispheres,SpherePlateau,RastriginPlateau,PiecewiseLinearPlateau,PiecewiseLinear1D_Y
#problems=InvertedHemispheres,SpherePlateau,RastriginPlateau,RastriginPlateau,CosinePlateausSmooth
problems=Michalewicz2


# ── MDE Exploration/Exploitation Experiment ──────────────────────────────────
# Commands:
#   ./gradlew runMdeEEExperiment
#   ./gradlew analyzeMdeEEExperiment
#   ./gradlew runAndAnalyzeMdeEEExperiment

# Supported strategies: rand, best
mde.strategy=rand

# Supported problems: Rastrigin, Ackley, Griewank, F03, F10, F20
mde.problem=Rastrigin
mde.dimension=10
mde.population=30
mde.evaluations=20000

# Run one repetition with 0..9, or all ten repetitions with all.
# Analysis expects all ten histories.
mde.run=all

# Number of top population members refined in each local-search phase.
mde.eliteSize=1

# Apply local search every N generations.
mde.localSearchFrequency=1

# Differential weight F in (0, 2] and crossover probability CR in [0, 1].
mde.F=0.5
mde.CR=0.9

# Relative paths are resolved from the repository root. Use forward slashes.
mde.historyDir=History/MDE
mde.analysisDir=EEAnalysis/MDE
